name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5.1", "5.2", "5.3", "5.4"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # opam のリポジトリ取得が git の background maintenance と競合して
      # .git/objects/maintenance.lock で落ちることがあるため無効化しておく
      - run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install --deps-only --with-test --with-doc .
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git config --global maintenance.auto false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
      - name: 契約 lint (.mli の要求/保証/不変)
        run: ./tools/lint_contracts.sh
      - run: opam install ocamlformat.0.29.0
      - run: opam exec -- dune build @fmt
